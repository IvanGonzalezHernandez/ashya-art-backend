server.port=8080

# ===========================================
# DATASOURCE (LOCAL por defecto)
# ===========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ashyaartdb_local?useSSL=false&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================
# JPA
# ===========================================
spring.jpa.hibernate.ddl-auto=${DDL_MODE:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# STRIPE
# ===========================================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:4200/?payment=success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:4200/?payment=error}

# ===========================================
# RESEND EMAIL
# ===========================================
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Ashya Art <info@ashya-art.com>}
resend.reply-to=${RESEND_REPLY_TO:ivangonzalez.code@gmail.com}
mail.admin.to=${MAIL_ADMIN_TO:ashyaxart@gmail.com}
# Limites del plan de Resend, para mostrar la cuota restante en el dashboard admin.
# Cambiar via env vars si se actualiza de plan (el Free plan es 100/dia y 3000/mes).
resend.daily-limit=${RESEND_DAILY_LIMIT:100}
resend.monthly-limit=${RESEND_MONTHLY_LIMIT:3000}

# ===========================================
# AUTENTICACION ADMIN (tokens de sesion firmados con HMAC-SHA256)
# ===========================================
# Si no se configura, se genera un secreto aleatorio al arrancar (las sesiones
# se invalidan en cada reinicio). Configurar en produccion para evitar eso.
auth.jwt-secret=${AUTH_JWT_SECRET:}
auth.token-expiration-hours=${AUTH_TOKEN_EXPIRATION_HOURS:12}

# ===========================================
# ENTORNO
# ===========================================
entorno.nombre=${ENVIRONMENT:LOCAL}

# ===========================================
# MANTENIMIENTO
# ===========================================
# Contraseña para previsualizar el sitio público mientras está en mantenimiento.
# Si no se configura, la previsualización queda desactivada.
mantenimiento.password=${MAINTENANCE_PASSWORD:}

# ===========================================
# REBUILD DEL FRONTEND (páginas prerenderizadas)
# ===========================================
# Deploy hook del sitio del frontend en Render. Se llama cuando cambian productos, cursos,
# tarjetas regalo o el stock, para regenerar su HTML. Vacío = desactivado (local).
frontend.deploy-hook-url=${FRONTEND_DEPLOY_HOOK_URL:}
frontend.rebuild-delay-seconds=${FRONTEND_REBUILD_DELAY_SECONDS:60}

# ===========================================
# ALMACENAMIENTO DE IMAGENES (archivos en disco, servidos en /uploads/**)
# ===========================================
app.upload-dir=${UPLOAD_DIR:uploads}
